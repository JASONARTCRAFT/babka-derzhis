<title>Бабка, держись!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one-screen game. Wooden seed tray on top, full-bleed scrolling street canvas below. */
:root{--wood:#7a4a26;--wood-d:#55321a;--wood-dd:#33200f;--paper:#fff3d6;--paper-d:#f0d9a8;--ink:#3a2210;--leaf-d:#2f6a17;--gold:#ffcf3f;--sky:#22150b;--sea:#2c5d8a;--pink:#ffd6e0;
--fd:"Lilita One",Impact,"Arial Black",sans-serif;--fb:Nunito,system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--sky);color:var(--paper);font-family:var(--fb);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#bar{position:fixed;left:0;right:0;top:0;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px;display:flex;align-items:center;gap:6px;background:linear-gradient(var(--wood),var(--wood-d));border-bottom:4px solid var(--wood-dd);overflow-x:auto;z-index:3;scrollbar-width:none}
.money{flex:0 0 auto;width:66px;height:74px;border-radius:10px;background:var(--wood-dd);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 2px 6px #0008}
.money canvas{width:30px;height:30px}
.money b{font:22px var(--fd);color:var(--gold);font-variant-numeric:tabular-nums}
.money.pulse{animation:pl .25s}
@keyframes pl{50%{transform:scale(1.15)}}
.card{flex:0 0 auto;position:relative;width:64px;height:74px;border-radius:9px;background:linear-gradient(#f3fbdc,#c6e39a);border:2px solid var(--leaf-d);box-shadow:0 3px 0 var(--leaf-d);display:flex;flex-direction:column;align-items:center;color:var(--ink);cursor:grab;touch-action:none;overflow:hidden;box-sizing:border-box}
.card canvas{width:46px;height:38px;margin-top:3px;pointer-events:none}
.card .nm{font:800 10px var(--fb);line-height:1.1;white-space:nowrap;pointer-events:none}
.card .co{font:15px var(--fd);color:var(--ink);pointer-events:none;line-height:1.1}
.card .cdv{position:absolute;left:0;right:0;top:0;height:0;background:rgba(30,18,8,.6);pointer-events:none}
.card.ab{background:linear-gradient(#e3f0ff,#9cc3ec);border-color:var(--sea);box-shadow:0 3px 0 var(--sea)}
.card.sh{background:linear-gradient(#efe6da,#c9b79c);border-color:#6b5a44;box-shadow:0 3px 0 #6b5a44}
.card.poor{filter:grayscale(.7) brightness(.75)}
.card.sel{outline:3px solid var(--gold);outline-offset:1px;transform:translateY(-3px)}
.card.no{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.sp{flex:1 1 auto;min-width:8px}
.ib{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:3px solid var(--wood-dd);background:var(--paper-d);color:var(--ink);font:17px var(--fd);cursor:pointer;display:grid;place-items:center;padding:0}
.ib:focus-visible,.btn:focus-visible,.lvb:focus-visible{outline:3px solid var(--gold)}
#cv{position:fixed;left:0;touch-action:none;display:block}
.scr{position:fixed;inset:0;overflow:auto;background:radial-gradient(ellipse at 50% 30%,#4f8f2c,#24451a 70%,#12230c);padding:max(16px,env(safe-area-inset-top,0px)) 16px 24px;box-sizing:border-box;text-align:center}
h1{font:clamp(40px,9vw,76px)/1 var(--fd);color:var(--gold);margin:8px 0 4px;text-shadow:0 4px 0 #7a3d10,0 8px 18px #0008;letter-spacing:1px;text-wrap:balance}
.sub{margin:0 0 6px;font-weight:800;color:#e8f5d0}
#art{width:640px;max-width:100%;height:auto;aspect-ratio:640/220}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-width:720px;margin:10px auto}
.lvb{border-radius:12px;border:3px solid var(--wood-dd);background:linear-gradient(var(--paper),var(--paper-d));color:var(--ink);padding:10px 8px;font:800 14px var(--fb);cursor:pointer;box-shadow:0 4px 0 var(--wood-dd);text-align:center}
.lvb b{display:block;font:26px var(--fd);color:var(--wood)}
.lvb .st{color:var(--gold);text-shadow:0 1px 0 var(--wood-dd);font-size:18px;letter-spacing:2px}
.lvb .st i{color:#b9a27c;font-style:normal}
.lvb:disabled{filter:grayscale(1) brightness(.7);cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.btn{font:20px var(--fd);background:linear-gradient(#9be15d,#53a32b);color:#fff;border:3px solid var(--leaf-d);border-radius:12px;padding:8px 18px;cursor:pointer;text-shadow:0 2px 0 var(--leaf-d);box-shadow:0 4px 0 var(--leaf-d)}
.btn.alt{background:linear-gradient(#ffe08a,#f2b33d);border-color:#8a5a12;box-shadow:0 4px 0 #8a5a12;text-shadow:0 2px 0 #8a5a12}
.btn.ghost{background:transparent;border-color:#ffffff55;box-shadow:none;font-size:14px;color:#ffffffaa;text-shadow:none}
.btn:active,.lvb:active{transform:translateY(3px);box-shadow:none}
.cured{font-weight:900;color:var(--pink)}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(18,10,4,.72);z-index:6;padding:16px;box-sizing:border-box}
.box{background:linear-gradient(var(--paper),var(--paper-d));color:var(--ink);border:4px solid var(--wood);border-radius:18px;padding:16px 20px;max-width:min(520px,100%);max-height:100%;overflow:auto;box-shadow:0 8px 0 var(--wood-dd);text-align:center;box-sizing:border-box}
.box h2{font:30px var(--fd);margin:0 0 4px;color:var(--wood);text-wrap:balance}
.box .tag{font:900 12px var(--fb);letter-spacing:.12em;text-transform:uppercase;color:#a0632e}
.box p{margin:6px 0 12px;font-weight:700;line-height:1.4}
.box canvas.big{width:150px;height:130px;background:radial-gradient(circle,#fff 0,#ffe8b0 55%,transparent 70%)}
.box.alm{text-align:left;max-width:min(780px,100%)}
.alm h3{font:22px var(--fd);color:var(--wood);margin:12px 0 6px}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ai{display:flex;gap:8px;align-items:flex-start;background:#ffffff88;border-radius:10px;padding:6px;min-width:0}
.ai canvas{width:56px;height:48px;flex:0 0 auto}
.ai div{min-width:0;font-size:12.5px;font-weight:700;line-height:1.3}
.ai b{display:block;font:15px var(--fd);color:var(--wood)}
.ai.lock{opacity:.55}
.stars{font-size:34px;color:var(--gold);text-shadow:0 2px 0 #8a5a12;letter-spacing:4px}
.stars i{color:#cdb98f;font-style:normal}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const $=s=>document.querySelector(s);
const bar=$('#bar'),cv=$('#cv'),g=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function el(x,cx,cy,rx,ry,c){x.fillStyle=c;x.beginPath();x.ellipse(cx,cy,Math.abs(rx),Math.abs(ry),0,0,7);x.fill()}
function rr(x,X,Y,w,h,r,c){x.fillStyle=c;x.beginPath();if(x.roundRect)x.roundRect(X,Y,w,h,r);else x.rect(X,Y,w,h);x.fill()}
function poly(x,c,...p){x.fillStyle=c;x.beginPath();x.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)x.lineTo(p[i],p[i+1]);x.closePath();x.fill()}

const pick=a=>a[Math.random()*a.length|0];

/* ---------- sound ---------- */
let AC=null,muted=false;
function tone(f,d=.08,type='square',v=.05,f2){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),n=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(n).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
let lastPop=0;
const SND={coin(){tone(880,.07,'sine',.08);setTimeout(()=>tone(1320,.12,'sine',.08),60)},place(){tone(200,.12,'triangle',.14,90)},
pop(){const n=performance.now();if(n-lastPop<60)return;lastPop=n;tone(520,.05,'square',.025,260)},zap(){tone(1400,.14,'sawtooth',.03,180)},
splash(){tone(260,.14,'triangle',.03,700)},cure(){tone(660,.09,'sine',.06);setTimeout(()=>tone(990,.14,'sine',.06),80)},
meow(){tone(760,.32,'sawtooth',.03,420)},bad(){tone(130,.25,'sawtooth',.05,70)},big(){tone(220,.6,'sawtooth',.05,110)},
win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.08),i*120))}};

/* ---------- save ---------- */
let save={lvl:0,stars:[],seen:{},cured:0};
try{Object.assign(save,JSON.parse(localStorage.getItem('babka-v2'))||{})}catch(e){}
function persist(){try{localStorage.setItem('babka-v2',JSON.stringify(save))}catch(e){}}

/* ---------- data ---------- */
const U={
wheel:{n:'Колесо',cost:50,cd:7,hp:300,s:'Котик бежит в колесе и роняет монетки. Кликай по ним.',d:'Котик бежит в колесе и раз в 12 секунд роняет монетку. Монетки сами не собираются: кликай по ним. На них строится всё остальное.'},
ball:{n:'Мячемёт',cost:100,cd:7,hp:300,up:3,s:'Стреляет мячами по своему ряду.',d:'Стреляет теннисными мячами вправо, когда кот подходит к газону. Улучшение (та же карта сверху): 2 мяча, потом 3 мяча и супер-ракетка.'},
spr:{n:'Брызгалка',cost:50,cd:7,hp:300,up:3,s:'Мочит котов: мокрые идут вдвое медленнее.',d:'Не ранит, а мочит: мокрый кот 3 секунды идёт вдвое медленнее. Размачивает коробки. Ур.1: пшик на 2 клетки. Ур.2: струя на 3. Ур.3: ещё и лужа на 3 клетки.'},
fence:{n:'Когтеточка',cost:50,cd:25,hp:1200,s:'Коты застревают и долго её царапают.',d:'Держит котов: они застревают и царапают её. Пылесос сносит 75% за удар, спортсмен перепрыгивает сколько угодно раз.'},
coil:{n:'Катушка',cost:125,cd:15,hp:300,up:3,s:'Ток на 2 клетки. Мокрым вдвое больнее, по луже бьёт всю лужу.',d:'Бьёт током на 2 клетки вперёд. Мокрым котам вдвое больнее. Если попадает в лужу, бьёт всех, кто в луже. Ур.2: 3 клетки. Ур.3: треугольник, ещё и соседние ряды.'},
cuc:{n:'Огурец',cost:25,cd:25,hp:300,s:'Одноразовый: кот в ужасе убегает на 4 клетки.',d:'Одноразовый. Кот подходит, огурец выпрыгивает, и кот в ужасе убегает на 4 клетки назад. Даже толстый.'},
laser:{n:'Указка',cost:50,cd:15,hp:300,s:'Уводит кота за точкой в соседний ряд.',d:'Рисует красную точку, кот бежит за ней в соседний ряд. 8 зарядов, потом батарейка садится. Толстяку лень: он её просто ломает.'},
yarn:{n:'Клубок',cost:25,cd:12,hp:300,s:'Стягивает котов из трёх рядов поиграть 5 секунд.',d:'Одноразовый. Стягивает по одному коту из своего и соседних рядов, и они 5 секунд играют на месте. Положи перед лужей с катушкой.'}};
const A={
pipe:{n:'Труба',cost:50,cd:20,s:'Тащи на гидрант: будет лужа.',d:'Перетащи на гидрант на улице: прорвёт трубу, и там 25 секунд будет лужа на 3 клетки. Коты в ней медленные и мокрые.'},
pole:{n:'Столб',cost:75,cd:20,s:'Тащи на столб: провод бьёт по луже рядом.',d:'Перетащи на фонарный столб: провод падает в ближайшую лужу и трижды бьёт током всех, кто в ней.'},
taxi:{n:'Такси',cost:150,cd:40,s:'Тащи на перекрёсток: −50% всем на нём.',d:'Перетащи на перекрёсток: такси проедет и снимет всем котам на перекрёстке половину здоровья.'},
truck:{n:'Мусоровоз',cost:300,cd:90,s:'Тащи на перекрёсток: лечит всех на нём.',d:'Перетащи на перекрёсток: дорого, но вылечит всех котов на перекрёстке разом.'}};
const SHOVEL={n:'Лопата',cost:0,cd:0,d:'Убирает поставленную защиту. Денег не возвращает.'};
const E={
cat:{n:'Зомби-кот',hp:120,sp:.28,dmg:20,d:'Обычный. Поодиночке не страшен, толпой очень.'},
fat:{n:'Толстяк',hp:520,sp:.17,dmg:50,lazy:1,d:'Крепкий и ленивый: не бегает ни за указкой, ни за клубком, указку ломает одним ударом. Огурца боится.'},
box:{n:'Кот в коробке',hp:170,sp:.22,dmg:20,d:'Коробка служит бронёй. Вода её размачивает, мячи почти не берут. Внутри от 1 до 3 котов, и они разбегаются по соседним рядам.'},
ath:{n:'Спортсмен',hp:110,sp:.42,dmg:25,d:'Быстрый. Перепрыгивает когтеточки сколько угодно раз и мигом ломает брызгалки. Ток бьёт его вдвое.'},
vac:{n:'Кот на пылесосе',hp:170,sp:.55,dmg:20,d:'Быстро едет. Врезается в когтеточку (минус 75%) и объезжает через соседний ряд. На третьем столкновении или на половине здоровья пылесос ломается.'},
mom:{n:'Кошка-мама',hp:150,sp:.15,dmg:20,d:'Медленная. На краю газона выпускает трёх котят в соседние ряды и идёт впереди них.'},
kit:{n:'Котёнок',hp:45,sp:.32,dmg:10,d:'Слабый, но их много.'},
lead:{n:'Вожак',hp:420,sp:.26,dmg:25,d:'Раз в 6 секунд мяукает: коты рядом 3 секунды бегут быстрее. Перед этим поднимает голову.'},
skate:{n:'Скейтер',hp:120,sp:.7,dmg:20,d:'Очень быстрый, пока не врежется. Потом скейт ломается, и он идёт пешком.'},
swim:{n:'Пловец',hp:150,sp:.28,dmg:20,swim:1,d:'Вода ему нипочём, брызгалки грызёт втрое быстрее. Берёт только мячами и током.'}};
const D=(c,s)=>({c,s});
const F2=[D(19,'t'),D(19,'b')],F3=[...F2,D(15,'t')],F4=[...F3,D(13,'b')],F5=[...F4,D(11,'t')];
const L=[
{n:'Первые гости',rows:2,cards:['wheel','ball'],doors:F2,start:150,w:[[10,'cat'],[32,'cat'],[50,'cat,cat'],[70,'cat'],[85,'cat,cat'],[105,'cat,cat,cat,cat',0,1]]},
{n:'Брызги',rows:3,cards:['wheel','ball','spr'],doors:F2,start:150,w:[[10,'cat'],[28,'cat,cat'],[46,'cat'],[60,'cat,cat'],[78,'cat,cat,cat'],[102,'cat,cat,cat,cat,cat,cat',0,1]]},
{n:'Толстяк',rows:3,cards:['wheel','ball','spr','fence'],doors:F2,start:150,w:[[10,'cat'],[28,'cat,cat'],[45,'fat'],[62,'cat,cat'],[78,'fat,cat'],[95,'cat,cat,cat'],[118,'fat,cat,cat,fat,cat,cat,cat',0,1]]},
{n:'Посылка',rows:4,cards:['wheel','ball','spr','fence','coil'],doors:F3,start:175,w:[[10,'cat,cat'],[30,'box'],[45,'cat,cat,cat'],[62,'box,cat',[2]],[80,'fat,box'],[98,'cat,cat,box,cat'],[122,'box,fat,cat,cat,box,cat,cat,box',[0,1,2],1]]},
{n:'Спортсмены',rows:4,cards:['wheel','ball','spr','fence','coil','cuc'],doors:F3,start:175,shovel:1,w:[[10,'cat,cat'],[28,'ath'],[45,'cat,box'],[60,'ath,ath',[2]],[78,'fat,ath,cat'],[95,'box,ath,cat,cat'],[120,'ath,fat,ath,cat,box,ath,cat,cat',[0,1,2],1]]},
{n:'Пылесосы',rows:5,cards:['wheel','ball','spr','fence','coil','cuc','laser'],doors:F4,start:200,shovel:1,w:[[10,'cat,cat'],[28,'vac'],[45,'cat,ath,cat'],[60,'vac,box',[3]],[78,'fat,vac,cat'],[94,'ath,cat,cat,vac',[2]],[118,'vac,fat,ath,cat,box,vac,cat,cat,cat',[0,1,2,3],1]]},
{n:'Лужи и провода',rows:5,cards:['wheel','ball','spr','fence','coil','cuc','laser','yarn'],ab:['pipe','pole'],doors:F4,start:200,shovel:1,pipes:[[1,12],[3,16]],poles:[[0,14],[4,11],[2,18]],
 w:[[10,'cat,cat,cat'],[28,'mom'],[45,'skate,cat'],[60,'mom,box',[2]],[76,'skate,skate,ath'],[92,'fat,mom,cat,cat',[3]],[118,'mom,skate,box,fat,cat,cat,skate,ath,cat',[0,1,2,3],1]]},
{n:'Вся улица',rows:6,cards:['wheel','ball','spr','fence','coil','cuc','laser','yarn'],ab:['pipe','pole','taxi','truck'],doors:F5,start:225,shovel:1,cross:[12,17],pipes:[[1,10],[4,14],[2,18]],poles:[[0,13],[5,10],[3,16]],
 w:[[10,'cat,cat,cat'],[26,'swim'],[42,'lead,cat,cat'],[58,'swim,box,cat',[2]],[74,'vac,ath,swim',[4]],[90,'lead,fat,cat,cat,mom'],[106,'skate,swim,box,ath',[3]],[130,'lead,swim,fat,vac,box,mom,cat,cat,ath,skate,cat,cat',[0,1,2,3,4],1]]}];
const YC=9,COLS=21,CATCOL=['#f0a04b','#9e9e9e','#5d4037','#ffcc80','#424242','#e0e0e0'];

/* ---------- drawing: units ---------- */
function drawUnit(x,u){const t=u.t,lv=u.lv||1,ph=u.ph||0,f=u.fire||0;
 el(x,0,0,24,6,'rgba(0,0,0,.25)');
 if(u.hurt>0)x.globalAlpha=.65;
 if(t=='wheel'){poly(x,'#8a5a2b',-20,0,-5,-32,-1,-32,-13,0);poly(x,'#8a5a2b',20,0,5,-32,1,-32,13,0);
  const R=25,cy=-34,a=ph*4;el(x,0,cy,R,R,'#f7e3c2');
  for(let i=0;i<8;i++){const q=a+i*Math.PI/4;ln(x,'#c49a6c',2,0,cy,Math.cos(q)*R,cy+Math.sin(q)*R)}
  const st=Math.sin(ph*16);x.save();x.translate(0,cy+R-3);
  ln(x,'#f0a04b',3.5,9,-9,16,-15+st*2);el(x,0,-9,11,7.5,'#f0a04b');el(x,-2,-7,6,4,'#ffe0b2');el(x,-11,-14,7.5,7,'#f0a04b');
  poly(x,'#f0a04b',-17,-17,-16,-25,-10,-19);poly(x,'#f0a04b',-8,-19,-4,-26,-3,-17);
  ln(x,'#c97a2e',3.5,-5+st*4,-4,-7+st*6,0);ln(x,'#c97a2e',3.5,6-st*4,-4,8-st*6,0);
  el(x,-14,-15,1.4,1.7,'#3a2210');el(x,-17,-12,1.3,1,'#d47a8a');x.restore();
  x.strokeStyle='#7a4a26';x.lineWidth=5;x.beginPath();x.arc(0,cy,R,0,7);x.stroke();el(x,0,cy,4,4,'#5a3a1c');}

  S.lv.doors.forEach((d,i)=>{if(S.spawns.some(s=>s.d===i&&s.t-S.t<4)&&FX(d.c+.5)-camX>VW)arrow(VW-C*.55,d.s=='t'?oy+TOPH*.5:FY(S.rows)+BOTH*.5,1,0,'rgba(255,193,7,.95)','!')})}
 // progress
 if(S.phase!='pre'){const w=Math.min(220,VW*.4),x=VW-w-14,y=VH-24,f=S.spawned/S.total;rr(g,x-4,y-4,w+8,22,10,'rgba(51,32,15,.85)');rr(g,x,y,w,14,7,'#4a3220');rr(g,x+w*(1-f),y,w*f,14,7,'#8bc34a');
  S.bigs.forEach(b=>{const i=S.spawns.length;const idx=(()=>{let n=0;S.lv.w.forEach(w=>{if(w[0]<b.t)n+=w[1].split(',').length});return n})();const fx=x+w*(1-idx/S.total);ln(g,'#fff',2,fx,y-8,fx,y+12);poly(g,'#e53935',fx,y-8,fx-10,y-4,fx,y)});
  g.save();g.translate(x+w*(1-f),y+12);g.scale(s*.45,s*.45);drawCat(g,{type:'cat',ph:0});g.restore();
  g.fillStyle='#fff3d6';g.font='800 12px Nunito,sans-serif';g.textAlign='right';g.textBaseline='middle';g.fillText('Уровень '+(S.i+1)+': '+S.lv.n,x-10,y+7)}
 if(S.phase=='play'&&S.hints.length){const t=S.hints[0].txt;g.font='800 15px Nunito,sans-serif';const ls=wrap(t,Math.min(460,VW-60)),w=Math.min(500,VW-30),h=ls.length*20+18,x=(VW-w)/2,y=8;
  rr(g,x,y+3,w,h,12,'rgba(58,34,16,.6)');rr(g,x,y,w,h,12,'#fff3d6');g.fillStyle='#3a2210';g.textAlign='center';g.textBaseline='top';ls.forEach((l,i)=>g.fillText(l,VW/2,y+10+i*20))}
 if(S.banner){const a=S.banner.life,sc=a>2.3?1+(a-2.3)*2:1;g.save();g.translate(VW/2,VH*.42);g.scale(sc,sc);g.globalAlpha=Math.min(1,a*2);txtOut(S.banner.t,0,0,Math.min(56,VW/12),'#ffcf3f','#7a2a10');g.restore();g.globalAlpha=1}
 if(S.phase=='intro'&&S.it>1.8&&S.it<4.6){txtOut('Сегодня придут:',VW/2,VH*.18,Math.min(36,VW/16),'#fff3d6')}
 if(S.phase=='ready'){const t=S.rt,w=t<.7?'Приготовься…':t<1.4?'Ставь…':'ЗАЩИЩАЙ!';txtOut(w,VW/2,VH*.45,Math.min(t<1.4?52:72,VW/9),t<1.4?'#fff3d6':'#ff5252','#3a2210')}
 if(S.paused)txtOut('Пауза',VW/2,VH*.45,56,'#fff3d6');
 // tooltip

  const e=S.enemies.find(e=>Math.abs(FX(e.x)-wx)<C*.35&&Math.abs(FY(e.y)+C*.5-wy)<C*.45);if(e)name=E[e.type].n+(e.soak>0?' (мокрый)':'');
  else{const{c,r}=cellAt(wx,wy),u=okR(r)&&unitAt(r,c);if(u)name=U[u.t].n+(u.lv>1?' · ур. '+u.lv:'')+(u.t=='laser'?' · '+u.charges+' зар.':'')}
  if(name){g.font='800 13px Nunito,sans-serif';const w=g.measureText(name).width+16;rr(g,ptr.x+12,ptr.y-30,w,24,8,'rgba(51,32,15,.92)');g.fillStyle='#fff3d6';g.textAlign='left';g.textBaseline='middle';g.fillText(name,ptr.x+20,ptr.y-18)}}
 // drag ghost
 const k=drag&&drag.moved?drag.k:(sel&&ptr.mouse?sel:null);
 if(k&&ptr.in&&ptr.y>0){g.save();g.globalAlpha=.8;g.translate(ptr.x,ptr.y+C*.35);g.scale(s,s);
  if(U[k])drawUnit(g,{t:k,lv:1,ph:S.t,fire:0,hp:1,max:1,charges:8});else if(k=='pipe')drawHydrant(g);else if(k=='pole')drawPole(g);else if(k=='shovel')drawShovel(g);else{g.translate(0,-40);drawCar(g,k)}g.restore()}}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(S&&!$('#game').hidden){
  if(S.phase=='intro')intro(dt);else if(S.phase=='ready'){S.rt+=dt;S.t+=0;if(S.rt>2.3)S.phase='play'}
  else if(!S.paused&&$('#ov').hidden&&(S.phase=='play'||S.phase=='won'))for(let i=0;i<S.speed;i++)step(dt);
  if(drag&&drag.moved&&ptr.in){if(ptr.x>VW-50)camX=clamp(camX+C*8*dt,0,maxCam());if(ptr.x<50)camX=clamp(camX-C*8*dt,0,maxCam())}
  draw();updBar()}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ---------- screens ---------- */
function overlay(html,btns,cls=''){const o=$('#ov');o.innerHTML=`<div class="box ${cls}">${html}<div class="row">${btns.map((b,i)=>`<button class="btn ${b[2]||''}" data-i="${i}">${b[0]}</button>`).join('')}</div></div>`;o.hidden=false;
 o.querySelectorAll('canvas[data-k]').forEach(c=>renderIcon(c,iconKind(c.dataset.k),c.dataset.k));
 o.querySelectorAll('canvas[data-g]').forEach(c=>{const x=c.getContext('2d');x.translate(c.width/2,c.height*.5);x.scale(2.4,2.4);drawGranny(x,0,1)});
 o.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{o.hidden=true;btns[b.dataset.i][1]()});o.querySelector('button')?.focus()}
function openReveal(){if(!S.trophy)return;S.trophy=null;const i=S.i,stars=Math.max(1,3-S.mowUsed);
 save.stars[i]=Math.max(save.stars[i]||0,stars);save.lvl=Math.max(save.lvl,Math.min(L.length-1,i+1));persist();
 const st=`<div class="stars">${'★'.repeat(stars)}<i>${'★'.repeat(3-stars)}</i></div>`;
 if(i+1<L.length){const nw=newCards(i+1),k=nw[0],d=cardDef(k);
  overlay(`<div class="tag">Новая находка</div><h2>${d.n}</h2>${st}<canvas class="big" width="300" height="260" data-k="${k}"></canvas><p>${d.d}</p>${nw.length>1?`<p>И ещё: ${nw.slice(1).map(x=>cardDef(x).n).join(', ')}.</p>`:''}<p class="cured">Котиков вылечено за всё время: ${save.cured}</p>`,[['Следующий уровень',()=>start(i+1)],['Уровни',toMenu,'alt']])}
 else overlay(`<div class="tag">Финал прототипа</div><h2>Улица спасена!</h2>${st}<canvas class="big" width="300" height="260" data-g="1"></canvas><p>Все зомби-коты вылечены и сидят у бабки на диване. Котиков вылечено: ${save.cured}.</p>`,[['Уровни',toMenu]])}
function toMenu(){S=null;sel=null;drag=null;$('#ov').hidden=true;$('#game').hidden=true;$('#menu').hidden=false;buildMenu()}
function buildMenu(){const box=$('#lvls');box.innerHTML='';L.forEach((l,i)=>{const b=document.createElement('button');b.className='lvb';b.disabled=i>save.lvl;const st=save.stars[i]||0;
  b.innerHTML=`<b>${i+1}</b>${l.n}<div class="st">${i>save.lvl?'<i>🔒</i>':'★'.repeat(st)+'<i>'+'★'.repeat(3-st)+'</i>'}</div>`;b.onclick=()=>start(i);box.append(b)});
 $('#curedN').textContent=save.cured?`Вылечено котиков: ${save.cured}`:'';drawArt()}
function drawArt(){const c=$('#art'),x=c.getContext('2d');x.clearRect(0,0,640,220);
 for(let i=0;i<9;i++){x.fillStyle=i%2?'#74bd42':'#68b237';x.fillRect(i*72-8,150,72,70)}rr(x,0,150,640,8,0,'rgba(255,255,255,.08)');
 rr(x,10,10,130,200,10,'#f1d3a0');rr(x,10,10,130,34,8,'#c0452f');rr(x,30,62,90,80,6,'#fff');rr(x,36,68,78,68,4,'#ffe9b0');
 x.save();x.beginPath();x.rect(36,68,78,68);x.clip();x.translate(75,110);x.scale(1.25,1.25);drawGranny(x,performance.now()/200,0);x.restore();
 const put=(f,X,Y,s)=>{x.save();x.translate(X,Y);x.scale(s,s);f();x.restore()};
 put(()=>drawUnit(x,{t:'wheel',lv:1,ph:1.2}),200,195,1.4);put(()=>drawUnit(x,{t:'ball',lv:3,ph:0}),290,195,1.4);put(()=>drawUnit(x,{t:'fence',lv:1,ph:0,hp:1,max:1}),370,195,1.3);

 put(()=>drawCoin(x,0,0,14),200,90,1)}

 <h3>Зомби-коты</h3><div class="ag">${Object.keys(E).map(k=>item(k,E[k],!save.seen[k])).join('')}</div>`,[['Закрыть',()=>{}]],'alm')};
